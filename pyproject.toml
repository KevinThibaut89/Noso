[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "noso"
version = "0.1.0"
description = "A Linux program that emulates a Sonos ZonePlayer (legacy UPnP plane)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# The core (SSDP + UPnP/SOAP + GENA) is pure Python standard library on
# purpose: it installs and runs on any stock Python 3.11+ with zero pip
# dependencies. Audio backends and the test harness are optional extras.
dependencies = []

[project.optional-dependencies]
# GStreamer backend needs the system PyGObject + gstreamer1.0 plugins.
# These are system packages (apt), not pip wheels; listed here for reference.
gstreamer = ["PyGObject>=3.42"]
# `mpv` backend (pure-python IPC, no compiled deps).
mpv = ["python-mpv>=1.0"]
# Development / verification harness. `soco` acts as a stand-in Sonos
# controller so the emulator can be exercised without the real app.
dev = ["soco>=0.30", "pytest>=7"]

[project.scripts]
noso = "noso.__main__:main"

[tool.setuptools.packages.find]
include = ["noso*"]

[tool.setuptools.package-data]
noso = ["assets/*.xml", "assets/scpd/*.xml", "assets/img/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
