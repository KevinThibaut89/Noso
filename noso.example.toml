# Noso configuration. Copy to /etc/noso/noso.toml (or anywhere) and pass with
# `noso --config <path>`. Every value is optional; CLI flags and NOSO_* env
# vars override the file. A [noso] table is also accepted.

# Name shown as the room/zone in the Sonos app and other controllers.
room_name = "Noso"

# Identity presented to controllers + the app. Defaults mimic a current-S2
# Sonos Connect. The *version* fields must be S2-current or the app flags the
# device "Sonos OS: S1" and demands a system update. To blend into your own
# household, set model_* and the version fields to values captured from a real
# speaker:  curl -s http://<speaker-ip>:1400/xml/device_description.xml
model_name = "Sonos Connect"
model_number = "ZP90"
software_version = "86.7-77050"
display_version = "17.2.5"
hardware_version = "1.17.5.5-2.0"
min_compatible_version = "85.0-00000"
legacy_compatible_version = "58.0-00000"

# Room icon (any Sonos x-rincon-roomicon:* value).
icon = "x-rincon-roomicon:living"

# LAN IP to advertise. Leave unset to autodetect the primary interface.
# interface_ip = "192.168.1.50"

# Audio backend: auto (gstreamer -> mpv -> ffmpeg -> null), or force one.
audio_backend = "auto"
# GStreamer sink override, e.g. a specific ALSA device:
# audio_sink = "alsasink device=hw:0"

log_level = "INFO"
